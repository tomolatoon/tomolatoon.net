<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5dd8f0"/>
      <stop offset="100%" stop-color="#8fa8f8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5dd8f0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5dd8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d580f5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d580f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fa8f8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8fa8f8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fbff"/>

  <!-- Decorative soft glow circles (GeoBg motif) -->
  <circle cx="80" cy="120" r="240" fill="url(#glow1)"/>
  <circle cx="1120" cy="510" r="280" fill="url(#glow2)"/>
  <circle cx="980" cy="70" r="160" fill="url(#glow3)"/>
  <circle cx="160" cy="560" r="200" fill="url(#glow3)"/>

  <!-- Frame: top bar -->
  <rect width="1200" height="6" fill="url(#accent)"/>
  <!-- Frame: bottom bar -->
  <rect y="624" width="1200" height="6" fill="url(#accent)"/>
  <!-- Frame: left bar -->
  <rect width="5" height="630" fill="url(#accent)"/>

  <!-- Site name -->
  <text
    x="624"
    y="282"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="76"
    font-weight="700"
    letter-spacing="-1.5"
    fill="#1a1a2e"
  >tomolatoon.net</text>

  <!-- Accent divider -->
  <rect x="576" y="314" width="88" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Tagline (Japanese) -->
  <text
    x="624"
    y="390"
    text-anchor="middle"
    font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif"
    font-size="30"
    letter-spacing="2"
    fill="#2a2a40"
  >C++ とボカロが好きな一般大学生</text>

  <!-- URL label -->
  <text
    x="624"
    y="470"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="22"
    fill="#555570"
  >https://tomolatoon.net</text>
</svg>
